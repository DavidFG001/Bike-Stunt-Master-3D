<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bike Stunt Master 3D</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="hud">
    <div class="brand">BIKE STUNT MASTER 3D</div>
    <div class="stats"><span>Distance: <b id="distance">0</b> m</span><span>Score: <b id="score">0</b></span></div>
    <div id="message">Tap RIDE to start</div>
  </div>
  <div id="controls">
    <button id="left" aria-label="Lean left">◀</button>
    <button id="ride">RIDE</button>
    <button id="right" aria-label="Lean right">▶</button>
    <button id="jump">JUMP</button>
  </div>
  <div id="help">Computer: ← / → steer · Space jump · R restart</div>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
